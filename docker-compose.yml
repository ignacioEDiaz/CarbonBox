services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: document_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Permite "docker compose up -d --wait": vuelve recién cuando Postgres acepta conexiones
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_processing"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
